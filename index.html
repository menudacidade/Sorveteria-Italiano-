<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorveteria Italiano - Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-top">
                <div class="user-info">
                    <span>Olá, Cliente! 👋</span>
                    <h2>SORVETERIA ITALIANO</h2>
                    <p>Gelado, cremoso e delicioso.</p>
                </div>
                <div class="header-actions">
                    <div class="icon-btn cart" onclick="openCart()"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartBadge">0</span></div>
                </div>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Busque seu açaí ou sorvete...">
                <div class="filter-btn"><i class="fas fa-sliders-h"></i></div>
            </div>
        </header>

        <!-- BANNER PRINCIPAL -->
        <section class="hero-banner">
            <img id="bannerImg" src="IMAGENS/Gemini_Generated_Image_tjalu4tjalu4tjal.jpg" alt="Banner Sorveteria Italiano">
        </section>

        <!-- CATEGORIAS -->
        <section class="categories">
            <div class="cat-item active" data-category="todos">
                <div class="cat-icon">
                    <img src="CATEGORIAS/todos.jpeg" alt="Todos">
                </div>
                <span>Todos</span>
            </div>
            <div class="cat-item" data-category="acai">
                <div class="cat-icon">
                    <img src="CATEGORIAS/WhatsApp Image 2026-10-05 at 01.40.53.jpeg" alt="Açaí">
                </div>
                <span>Açaí</span>
            </div>
            <div class="cat-item" data-category="shake">
                <div class="cat-icon">
                    <img src="CATEGORIAS/milk.jpeg" alt="Milk Shake">
                </div>
                <span>Milk Shake</span>
            </div>
            <div class="cat-item" data-category="sorvete">
                <div class="cat-icon">
                    <img src="CATEGORIAS/sorvetes.jpeg" alt="Sorvetes">
                </div>
                <span>Sorvetes</span>
            </div>
            <div class="cat-item" data-category="bebida">
                <div class="cat-icon">
                    <img src="CATEGORIAS/Bebidas Geladas com Gelo e Condensação.png" alt="Bebidas">
                </div>
                <span>Bebidas</span>
            </div>
        </section>

        <!-- SEÇÃO DE PRODUTOS -->
        <section class="menu-section" id="menu-section">
            <div class="section-header">
                <h3 id="sectionTitle">Nossos Produtos</h3>
                <a href="#">Ver Tudo <i class="fas fa-arrow-right"></i></a>
            </div>

            <div class="product-grid" id="productGrid">
                <!-- Produtos renderizados via JS -->
            </div>
        </section>

        <!-- ============================================= -->
        <!-- BANNER INFERIOR - IMAGEM CLICÁVEL PARA WHATSAPP -->
        <!-- ============================================= -->
        <!-- ⬇️ SUBSTITUA O LINK ABAIXO PELA SUA IMAGEM ⬇️ -->
        <section class="promo-banner-img" onclick="especialDoDia()">
            <img src="IMAGENS/especial do dia.png" alt="Especial do Dia - Sorveteria Italiano">
        </section>
        <!-- ============================================= -->

        <!-- NAVEGAÇÃO INFERIOR -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="scrollToTop()">
                <i class="fas fa-home"></i><span>Início</span>
            </div>
            <div class="nav-item cart-nav" onclick="openCart()">
                <i class="fas fa-shopping-cart"></i>
                <span>Carrinho</span>
                <span class="cart-badge" id="cartNavBadge">0</span>
            </div>
        </nav>
    </div>

    <!-- MODAL DE PRODUTO (ADICIONAIS) -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Produto</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="modal-body">
                <div class="modal-product-img">
                    <img id="modalImage" src="" alt="Produto">
                </div>

                <div class="quantity-selector">
                    <span>Quantidade:</span>
                    <div class="qty-controls">
                        <button onclick="changeQty(-1)"><i class="fas fa-minus"></i></button>
                        <span id="qtyValue">1</span>
                        <button onclick="changeQty(1)"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <p class="modal-desc" id="addonsTitle">Escolha seus adicionais:</p>
                <div id="addonsList" class="addons-list"></div>
            </div>

            <div class="modal-footer">
                <div class="total-price">
                    <span>Total:</span>
                    <strong id="modalTotal">R$ 0,00</strong>
                </div>
                <button class="btn-add-cart" onclick="addToCart()">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DO CARRINHO -->
    <div class="modal-overlay" id="cartOverlay" onclick="closeCart(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>🛒 Seu Carrinho</h3>
                <button class="close-btn" onclick="closeCart()"><i class="fas fa-times"></i></button>
            </div>

            <div class="modal-body" id="cartBody">
                <!-- Itens do carrinho renderizados via JS -->
            </div>

            <div class="modal-footer cart-footer">
                <div class="total-price">
                    <span>Total do Pedido:</span>
                    <strong id="cartTotal">R$ 0,00</strong>
                </div>
                <div class="cart-actions">
                    <button class="btn-clear" onclick="clearCart()"><i class="fas fa-trash"></i> Limpar</button>
                    <button class="btn-add-cart" onclick="openCheckout()">Finalizar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT (DADOS DO CLIENTE) -->
    <div class="modal-overlay" id="checkoutOverlay" onclick="closeCheckout(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>📝 Dados do Pedido</h3>
                <button class="close-btn" onclick="closeCheckout()"><i class="fas fa-times"></i></button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label>Seu Nome *</label>
                    <input type="text" id="clientName" placeholder="Digite seu nome">
                </div>

                <div class="form-group">
                    <label>Endereço de Entrega *</label>
                    <input type="text" id="clientAddress" placeholder="Rua, número, bairro">
                </div>

                <div class="form-group">
                    <label>Telefone *</label>
                    <input type="tel" id="clientPhone" placeholder="(42) 99999-9999">
                </div>

                <div class="form-group">
                    <label>Forma de Pagamento *</label>
                    <select id="paymentMethod">
                        <option value="">Selecione...</option>
                        <option value="Pix">Pix</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Observações</label>
                    <textarea id="clientNotes" placeholder="Ex: Entrega perto de tal lugar.. troco para R$ 50..."></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <div class="total-price">
                    <span>Total:</span>
                    <strong id="checkoutTotal">R$ 0,00</strong>
                </div>
                <button class="btn-add-cart" onclick="enviarPedido()">Enviar no WhatsApp</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
